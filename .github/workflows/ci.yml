name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Lint, format, types and the suite across every supported interpreter, from the shared
  # workflow in PNX89/.github, pinned to a tag rather than a moving branch.
  #
  # mypy runs on EVERY leg rather than once, and that is deliberate: the wheel ships py.typed, so
  # the annotations are a promise to every consumer, and what type checks on 3.14 is not what type
  # checks on 3.11. The 3.11 leg is where a version specific typing mistake shows up.
  #
  # What the pipeline is for, and the five things it deliberately does not gate, is at
  # https://github.com/PNX89/.github/blob/main/docs/adr/0001-what-ci-is-for.md
  checks:
    name: checks
    uses: PNX89/.github/.github/workflows/checks.yml@v1
    with:
      python-versions: '["3.11", "3.12", "3.13", "3.14"]'
      sync-args: "--all-extras --dev"
      run-mypy: true

  package:
    name: wheel carries py.typed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Build
        run: uv build

      # A package or directory name mismatch drops the marker from the wheel silently under
      # hatchling's src-layout discovery, so the wheel itself is what gets checked.
      - name: The wheel must ship the typing marker
        run: unzip -l dist/quidz-*.whl | grep -q 'quidz/py.typed'
